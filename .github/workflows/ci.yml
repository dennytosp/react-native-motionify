name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard package version
        run: |
          BASE_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          RELEASED_VERSION="${BASE_TAG#v}" node scripts/check-release-version.mjs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify published files
        run: |
          test -f lib/index.js
          test -f lib/index.d.ts
          npm pack --dry-run

  package:
    name: Pack artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: react-native-motionify-tarball
          path: "*.tgz"
          retention-days: 7
