version: 2

# Two pull requests per ecosystem at most, not one per dependency.
#
# Minor and patch updates travel together: they are routine, they either all
# pass CI or the group tells you which one broke. Majors travel in a separate
# group because that is where breaking changes live — TypeScript 7 removing
# `moduleResolution=node10` should not be able to hold four harmless bumps
# hostage in the same pull request.
#
# Published-package and workflow dependencies request a patch release. The
# example app is not shipped to npm, so its updates have no release label and
# use the default skip decision.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "release:patch"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major-updates:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(example-deps)"
    groups:
      example:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      example-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "release:patch"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
